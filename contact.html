      </section>
      <section class="section split">
        <div>
          <h2>Nous contacter</h2>
          <p>Pour signaler une offre, proposer une opportunite ou joindre l'equipe.</p>

        <form class="form-card" id="contactForm" data-lead-type="contact">
          <label>

            <input name="name" required placeholder="Votre nom" />
          </label>
          <label>
            Contact
            <input name="contact" required placeholder="Telephone ou email" />
          </label>
          <label>
            Objet
            <select name="subject" required>
              <option value="">Choisir</option>
              <option>Publier une offre</option>
              <option>Sponsoriser</option>
              <option>Signaler une annonce</option>
              <option>Partenariat</option>
            </select>
          </label>
          <button type="submit">Envoyer</button>
          <p class="form-note" id="contactMessage"></p>
        </form>
      </section>
