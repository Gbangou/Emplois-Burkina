name: Content Automation

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emplois-burkina-automation
  cancel-in-progress: false

jobs:
  automate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      EMPLOIS_BURKINA_QUALITY_STRICT: "false"
      EMPLOIS_BURKINA_AUTOMATION_INTERVAL_MINUTES: "360"
      EMPLOIS_BURKINA_CRAWLER_AGENT: "Emplois BurkinaBot/0.1 (+contact: contact@emplois-burkina.com)"
      SOCIAL_AUTOPUBLISH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run automation
        run: pnpm run automate

      - name: Check generated output
        run: pnpm run check:legacy

      - name: Commit generated changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(content): refresh automated jobs and SEO"
          file_pattern: "data/*.json data/growth/*.json docs/*.md pages/**/*.html sitemap.xml robots.txt ads.txt feed.xml feed.json llms.txt indexnow-urls.txt site.webmanifest assets/*"
